
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FrameYou - Sistema Administrativo</title>
    <link rel="stylesheet" href="..\admin\assets\css\style.css">
</head>
<body>

    <header>

        <div class="cabecalho">

            <a href="..\admin\login.html">
                <img src="..\admin\assets\images\logo.png" alt="FrameYou - Roupas que vestem você">
            </a>

        </div>

        <nav aria-label="Navegação principal">

            <ul>

                <li>
                    <a href="..\admin\login.html">LOGIN</a>
                </li>

                <li>
                    <a href="..\admin\lista.html">PERFIL</a>
                </li>

                <li>
                    <a href="..\admin\dashboard.html">DASHBOARD</a>
                </li>

            </ul>

        </nav>

    </header>

    <main>

        <section class="login">

            <div class="formulario-login">

                <h1>LOGIN</h1>

                <p>Acesse o sistema administrativo da FrameYou</p>

                <form id="form-login">

                    <div class="campo-formulario">

                        <label for="email-login">E-mail</label>

                        <input
                            type="email"
                            id="email-login"
                            name="email"
                            placeholder="Digite seu e-mail"
                            autocomplete="username"
                            required
                        >

                    </div>

                    <div class="campo-formulario">

                        <label for="senha-login">Senha</label>

                        <input
                            type="password"
                            id="senha-login"
                            name="senha"
                            placeholder="Digite sua senha"
                            autocomplete="current-password"
                            required
                        >
                    </div>

                    <button type="submit">ENTRAR</button>

                </form>

                <p class="alternar-formulario">
                    Ainda não tem uma conta?
                    <a href="#" id="link-cadastro">Cadastre-se</a>
                </p>

            </div>

            <div class="formulario-cadastro" id="formulario-cadastro" hidden>

                <h1>CADASTRO</h1>

                <p>Crie sua conta para acessar o sistema</p>

                <form id="form-cadastro">

                    <div class="campo-formulario">

                        <label for="nome">Nome completo</label>

                        <input
                            type="text"
                            id="nome"
                            name="nome"
                            placeholder="Digite seu nome completo"
                            autocomplete="name"
                            required
                        >
                
                    </div>

                    <div class="campo-formulario">

                        <label for="email-cadastro">E-mail</label>

                        <input
                            type="email"
                            id="email-cadastro"
                            name="email"
                            placeholder="Digite seu e-mail"
                            autocomplete="email"
                            required
                        >

                    </div>

                    <div class="campo-formulario">

                        <label for="senha-cadastro">Senha</label>

                        <input
                            type="password"
                            id="senha-cadastro"
                            name="senha"
                            placeholder="Crie uma senha"
                            autocomplete="new-password"
                            required
                        >

                    </div>

                    <div class="campo-formulario">

                        <label for="confirmar-senha">Confirmar senha</label>

                        <input
                            type="password"
                            id="confirmar-senha"
                            name="confirmar-senha"
                            placeholder="Confirme sua senha"
                            autocomplete="new-password"
                            required
                        >

                    </div>

                    <button type="submit">CADASTRAR</button>

                </form>

                <p class="alternar-formulario">
                    Já tem uma conta?
                    <a href="#" id="link-login">Faça Login</a>
                </p>

            </div>
            
        </section>

    </main>

    <footer>

        <div class="links-footer">

            <h2>FrameYou - Sistema Administrativo</h2>

            <ul>

                <li>
                    <a href="..\admin\login.html">Login</a>
                </li>

                <li>
                    <a href="..\admin\lista.html">Perfil</a>
                </li>

                <li>
                    <a href="..\admin\dashboard.html">Dashboard</a>
                </li>

            </ul>

        </div>

    </footer>

    <script src="..\admin\assets\js\script.js"></script>

</body>
</html>
