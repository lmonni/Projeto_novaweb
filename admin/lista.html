
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FrameYou - Sistema Administrativo</title>
    <link rel="stylesheet" href="..\admin\assets\css\style.css">
</head>
<body>

    <header>

        <div class="cabecalho">

            <a href="..\admin\login.html">
                <img src="..\admin\assets\images\logo.png" alt="FrameYou - Roupas que vestem você">
            </a>

        </div>

        <nav aria-label="Navegação principal">

            <ul>

                <li>
                    <a href="..\admin\login.html">LOGIN</a>
                </li>

                <li>
                    <a href="..\admin\lista.html">PERFIL</a>
                </li>

                <li>
                    <a href="..\admin\dashboard.html">DASHBOARD</a>
                </li>

                <li>
                    <button type="button" onclick="sairSistema()">SAIR</button>
                </li>

            </ul>

        </nav>

    </header>

    <main>

        <section class="area-administrativa">

            <div class="abas">

                <button type="button" class="aba ativa" id="aba-perfil">Meu Perfil</button>

                <button type="button" class="aba" id="aba-usuarios">Consulta de Usuários</button>

            </div>

            <section id="conteudo-perfil" class="conteudo-aba">

                <div class="cabecalho-secao">

                    <h1>Meu Perfil</h1>
                    <p>Visualize e atualize suas informações pessoais</p>

                </div>

                <div class="informacoes-perfil">

                    <div class="dados-perfil">

                        <div class="campo-formulario">

                            <label for="nome-perfil">Nome completo</label>

                            <input
                                type="text"
                                id="nome-perfil"
                                name="nome"
                                placeholder="Digite seu nome completo"
                            >

                        </div>

                        <div class="campo-formulario">

                            <label for="email-perfil">E-mail</label>

                            <input
                                type="email"
                                id="email-perfil"
                                name="email"
                                placeholder="Digite seu e-mail"
                            >

                        </div>

                        <div class="campo-formulario">

                            <label for="telefone-perfil">Telefone</label>

                            <input
                                type="tel"
                                id="telefone-perfil"
                                name="telefone"
                                placeholder="Digite seu telefone"
                            >

                        </div>

                    </div>

                    <div class="acoes-perfil">

                        <button type="button" id="editar-perfil">EDITAR INFORMAÇÕES</button>
                        <button type="button" id="salvar-perfil" disabled>SALVAR ALTERAÇÕES</button>

                    </div>

                </div>

            </section>

            <section id="conteudo-usuarios" class="conteudo-aba" hidden>

                <div class="cabecalho-secao">

                    <h1>Consulta de Usuários</h1>
                    <p>Gerencie os usuários cadastrados no sistema administrativo</p>

                </div>

                <div class="acoes-consulta">

                    <div class="pesquisa-usuarios">

                        <label for="pesquisa-usuario">Pesquisar usuários</label>
                        
                        <input
                            type="search"
                            id="pesquisa-usuario"
                            placeholder="Pesquise por nome, e-mail ou ID"
                        >

                    </div>

                    <div class="botoes-consulta">

                        <button type="button" id="filtrar-usuarios">FILTRAR</button>
                        <button type="button" id="exportar-usuarios">EXPORTAR</button>
                        <button type="button" id="adicionar-usuario">ADICIONAR USUÁRIO</button>

                    </div>

                </div>

                <div class="tabela-usuarios">

                    <table>

                        <thead>

                            <tr>

                                <th>ID</th>
                                <th>Nome completo</th>
                                <th>E-mail</th>
                                <th>Telefone</th>
                                <th>Função</th>
                                <th>Status</th>
                                <th>Ações</th>

                            </tr>

                        </thead>

                        <tbody id="lista-usuarios">


                        </tbody>

                    </table>
                    
                </div>

            </section>

        </section>
        
    </main>

    <footer>

        <div class="links-footer">

            <h2>FrameYou - Sistema Administrativo</h2>

            <ul>

                <li>
                    <a href="..\admin\login.html">Login</a>
                </li>

                <li>
                    <a href="..\admin\lista.html">Perfil</a>
                </li>

                <li>
                    <a href="..\admin\dashboard.html">Dashboard</a>
                </li>

            </ul>

        </div>

    </footer>

    <script src="..\admin\assets\js\script.js"></script>

</body>
</html>
