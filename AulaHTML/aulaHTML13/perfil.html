<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Perfil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</head>
<body>
    <header>
        <h1>Bem-vindo ao Perfil</h1>
    </header>
    <main>
        <form class="form" id="formulario">
            <div class="alert alert-info" role="alert" id="mensagem" style="display: none;">
            </div>

            <div>
                <img src="gatovelho.jpg" alt="Foto de Perfil" width="150"
                onmouseover="console.log('Mouse sobre a imagem')">
            </div>

            <div class="form-group">
                <label for="nome" class="form-label">Nome: </label>
                <input type="text" class="form-control" id="nome" 
                name="nome" required>
            </div>

            <div class="form-group">
                <label for="nascimento" class="form-label">Nascimento: </label>
                <input type="date" class="form-control" id="nascimento"
                name="nascimento" min="1909-01-01" max="2016-01-01" required>
            </div>

            <div class="form-group">
                <label for="cpf" class="form-label">CPF: </label>
                <input type="text" class="form-control" id="cpf" name="cpf"
                required onblur="validaCPF()">
            </div>

            <div class="form-group">
                <label class="form-label">Experiência: </label>

                <div>
                    <input type="radio" id="junior" name="experiencia"
                    value="Júnior" required>
                    <label for="junior">Júnior</label>
                </div>

                <div>
                    <input type="radio" id="pleno" name="experiencia"
                    value="Pleno">
                    <label for="pleno">Pleno</label>
                </div>

                <div>
                    <input type="radio" id="senior" name="experiencia"
                    value="Sênior">
                    <label for="senior">Sênior</label>
                </div>

            </div>

            <div class="form-group">
                <label class="form-label">Quais você conhece? </label>

                <div>
                    <input type="checkbox" id="html" name="conhecimento"
                    value="HTML">
                    <label for="html">HTML</label>
                </div>

                <div>
                    <input type="checkbox" id="css" name="conhecimento"
                    value="CSS">
                    <label for="css">CSS</label>
                </div>

                <div>
                    <input type="checkbox" id="javascript" name="conhecimento"
                    value="JavaScript">
                    <label for="javascript">JavaScript</label>
                </div>

            </div>

            <div class="form-group">
                <label for="estado" class="form-label">Estado: </label>

                <select id="estado" name="estado" class="form-control" required>
                    <option value="">Selecione o seu estado</option>
                    <option value="SP">São Paulo</option>
                    <option value="MG">Minas Gerais</option>
                    <option value="RJ">Rio de Janeiro</option>
                    <option value="ES">Espírito Santo</option>
                </select>
            </div>

            <div class="form-group">
                <label for="descricao" class="form-label">Sobre mim: </label>

                <textarea id="descricao" name="descricao" class="form-control"
                rows="4"></textarea>
            </div>

            <div class="form-group mt-3">
                <button type="submit" class="btn btn-primary">Salvar</button>
                <button type="reset" class="btn btn-secondary">Limpar</button>
            </div>

        </form>
    </main>
    
    <script type="text/javascript">
    function mensagem() {
        const msg = document.querySelector('#mensagem');
        msg.style.display = 'block';
        msg.textContent = 'Perfil salvo com sucesso!';
    }

    function validaCPF() {
        const cpf = document.querySelector('#cpf').value;

        if (cpf.length !== 11) {
            const msg = document.querySelector('#mensagem');
            msg.style.display = 'block';
            msg.textContent = 'CPF inválido. Deve conter 11 dígitos.';
            return false;
        }

        return true;
    }

    document.querySelector('#formulario').addEventListener('submit', function(event) {
        event.preventDefault();

        if (validaCPF()) {
            mensagem();
        }
    });
    </script>
</body>
</html>
