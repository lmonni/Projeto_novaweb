<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilos.css">
    <title>Aula 14</title>
</head>
<body>
    <h1>Aula 14 - CSS para Formulários</h1>

    <label for="nome">Nome: </label>
    <input type="text" id="nome" disabled>
    <button onclick="habilitar('nome')">Habilitar</button>

    <label for="email">E-mail: </label>
    <input type="email" id="email" disabled>
    <button onclick="habilitar('email')">Habilitar</button>

    <label for="telefone">Telefone: </label>
    <input type="tel" id="telefone" disabled>
    <button onclick="habilitar('telefone')">Habilitar</button>

    <label for="cidade">Cidade: </label>
    <input type="text" id="cidade" disabled>
    <button onclick="habilitar('cidade')">Habilitar</button>

</body>
</html>
